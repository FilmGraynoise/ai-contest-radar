<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI로 만들 수 있는 국내 창작 공모전을 한곳에서 찾는 AI Contest Radar" />
  <title>AI Contest Radar</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">AI CREATOR'S CONTEST FINDER</p>
        <h1>AI Contest Radar</h1>
        <p class="hero-copy">AI로 만들 수 있는 공모전만 빠르게 찾자.</p>
      </div>
      <div class="hero-stat" id="heroStat">
        <strong>—</strong>
        <span>공모전</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="공모전 검색 및 필터">
      <div class="search-wrap">
        <label class="sr-only" for="searchInput">공모전 검색</label>
        <input id="searchInput" type="search" placeholder="공모전, 주최사, 키워드 검색" autocomplete="off" />
      </div>

      <div class="chips" id="categoryChips">
        <button class="chip active" data-category="all">전체</button>
        <button class="chip" data-category="image">🎨 그림</button>
        <button class="chip" data-category="video">🎬 영상</button>
        <button class="chip" data-category="writing">✍️ 글</button>
        <button class="chip" data-category="music">🎵 음악</button>
        <button class="chip" data-category="other">✨ 기타</button>
      </div>

      <div class="select-row">
        <label>
          <span>AI 조건</span>
          <select id="aiFilter">
            <option value="active">AI 참여 가능 전체</option>
            <option value="required">AI 필수</option>
            <option value="allowed">AI 가능</option>
            <option value="restricted">조건부</option>
            <option value="unknown">확인 필요</option>
            <option value="all">AI 금지 포함 전체</option>
          </select>
        </label>

        <label>
          <span>정렬</span>
          <select id="sortSelect">
            <option value="deadline">마감 임박순</option>
            <option value="newest">신규 등록순</option>
            <option value="prize">상금 높은순</option>
          </select>
        </label>
      </div>
    </section>

    <section class="summary-row">
      <p id="resultCount">불러오는 중...</p>
      <p class="notice">응모 전 반드시 원문 공고를 확인해줘.</p>
    </section>

    <section id="cards" class="cards" aria-live="polite"></section>

    <section id="emptyState" class="empty hidden">
      <h2>조건에 맞는 공모전이 없어.</h2>
      <p>검색어나 필터를 바꿔봐.</p>
    </section>

    <section id="errorState" class="empty hidden">
      <h2>데이터를 불러오지 못했어.</h2>
      <p id="errorMessage"></p>
    </section>
  </main>

  <footer>
    <p>AI 분석은 참고용이야. 최종 규정·일정·상금은 주최사 원문이 기준이야.</p>
  </footer>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
